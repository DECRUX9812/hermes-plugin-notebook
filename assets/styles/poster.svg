<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="gfx-title gfx-desc" data-template="cover" data-preset="poster" data-detail="standard"><title id="gfx-title">Tidal power — what actually decides a project</title><desc id="gfx-desc">Poster cover. titled “Tidal power — what actually decides a project”. showing 6 figures (1.2 GW planned capacity; 38% capacity factor; £1.4bn cable cost). takeaway: Output is set by the site, the cost by the cable, and the schedule by the consent — in that order..</desc><defs></defs><linearGradient id="poster" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1b3a"/><stop offset="1" stop-color="#0c0c1a"/></linearGradient><rect width="1200" height="900" fill="url(#poster)"/><text x="50.0" y="422.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#8b7cff" letter-spacing="3">INFOGRAPHIC</text><text x="50.0" y="532.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="84" font-weight="700" fill="#f4f4fa">Tidal power —</text><text x="50.0" y="627.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="84" font-weight="700" fill="#f4f4fa">what actually</text><text x="50.0" y="722.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="84" font-weight="700" fill="#f4f4fa">decides a project</text><text x="50.0" y="823.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="400" fill="#b9b9d6">A worked example of the pack</text><text x="1150.0" y="882.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#b9b9d6" text-anchor="end">sample data — not a real notebook</text></svg>