<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="gfx-title gfx-desc" data-template="infographic" data-preset="neon" data-detail="standard"><title id="gfx-title">Tidal power — six numbers that decide a project</title><desc id="gfx-desc">Neon infographic. titled “Tidal power — six numbers that decide a project”. showing 6 figures (1.2 GW planned capacity; 38% capacity factor; £1.4bn cable cost). takeaway: Output is set by the site, the cost by the cable, and the schedule by the consent — in that order..</desc><defs><filter id="glow" x="-40%" y="-60%" width="180%" height="240%"><feGaussianBlur stdDeviation="70"/></filter></defs><linearGradient id="poster" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070711"/><stop offset="1" stop-color="#030307"/></linearGradient><rect width="1200" height="900" fill="url(#poster)"/><g filter="url(#glow)" opacity="0.40"><ellipse cx="216" cy="90" rx="360" ry="252" fill="#9063bd"/><ellipse cx="1032" cy="792" rx="312" ry="234" fill="#127482"/></g><text x="50.0" y="66.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#c084fc" letter-spacing="3">INFOGRAPHIC</text><rect x="50.0" y="78.0" width="72.0" height="3.0" fill="#c084fc"/><text x="1150.0" y="65.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#b9aee0" text-anchor="end">Neon · 4 stats</text><text x="50.0" y="132.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="50" font-weight="700" fill="#f8f7ff">Tidal power — six numbers</text><text x="50.0" y="186.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="50" font-weight="700" fill="#f8f7ff">that decide a project</text><rect x="50.0" y="236.0" width="261.0" height="200.0" rx="18.0" fill="#111126"/><rect x="50.0" y="236.0" width="261.0" height="5.0" rx="2.0" fill="#c084fc"/><text x="66.0" y="311.9" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="56" font-weight="700" fill="#c084fc">1.2 GW</text><text x="66.0" y="354.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#f8f7ff">planned capacity</text><rect x="329.0" y="236.0" width="261.0" height="200.0" rx="18.0" fill="#111126"/><rect x="329.0" y="236.0" width="261.0" height="5.0" rx="2.0" fill="#22d3ee"/><text x="345.0" y="313.6" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="58" font-weight="700" fill="#22d3ee">38%</text><text x="345.0" y="354.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#f8f7ff">capacity factor</text><rect x="608.0" y="236.0" width="261.0" height="200.0" rx="18.0" fill="#111126"/><rect x="608.0" y="236.0" width="261.0" height="5.0" rx="2.0" fill="#f472b6"/><text x="624.0" y="313.6" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="58" font-weight="700" fill="#f472b6">£1.4bn</text><text x="624.0" y="354.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#f8f7ff">cable cost</text><rect x="887.0" y="236.0" width="261.0" height="200.0" rx="18.0" fill="#111126"/><rect x="887.0" y="236.0" width="261.0" height="5.0" rx="2.0" fill="#c084fc"/><text x="903.0" y="313.6" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="58" font-weight="700" fill="#c084fc">11 yrs</text><text x="903.0" y="354.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="400" fill="#f8f7ff">consent timeline</text><text x="50.0" y="498.8" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="400" fill="#c084fc">—</text><text x="90.0" y="500.4" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="400" fill="#f8f7ff">The resource is reliable; the grid connection is what sinks projects.</text><text x="90.0" y="530.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#b9aee0">IEA Marine</text><text x="50.0" y="574.8" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="400" fill="#c084fc">—</text><text x="90.0" y="576.4" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="400" fill="#f8f7ff">Consenting takes longer than construction on every project reviewed.</text><text x="90.0" y="606.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#b9aee0">Offshore Review</text><rect x="50.0" y="765.0" width="1100.0" height="110.0" rx="16.0" fill="#241b36"/><rect x="50.0" y="765.0" width="5.0" height="110.0" fill="#c084fc"/><text x="72.0" y="795.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#c084fc" letter-spacing="2.6">TAKEAWAY</text><text x="72.0" y="833.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#f8f7ff">Output is set by the site, the cost by the cable, and the schedule by the consent — in</text><text x="72.0" y="866.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#f8f7ff">that order.</text></svg>