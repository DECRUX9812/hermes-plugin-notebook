<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="gfx-title gfx-desc" data-template="infographic" data-preset="terminal" data-detail="standard"><title id="gfx-title">Tidal power — six numbers that decide a project</title><desc id="gfx-desc">Terminal infographic. titled “Tidal power — six numbers that decide a project”. showing 6 figures (1.2 GW planned capacity; 38% capacity factor; £1.4bn cable cost). takeaway: Output is set by the site, the cost by the cable, and the schedule by the consent — in that order..</desc><defs><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#ffffff" opacity="0.035"/></pattern></defs><rect x="0.0" y="0.0" width="1200.0" height="900.0" fill="#070b12"/><rect x="0.0" y="0.0" width="1200.0" height="900.0" fill="url(#scan)"/><text x="50.0" y="66.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#38bdf8" letter-spacing="3">OUTPUT</text><rect x="50.0" y="78.0" width="72.0" height="3.0" fill="#38bdf8"/><text x="1150.0" y="65.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="18" font-weight="400" fill="#8a97a8" text-anchor="end">Terminal · 4 stats</text><text x="50.0" y="132.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="50" font-weight="700" fill="#e6edf6">Tidal power — six numbers</text><text x="50.0" y="186.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="50" font-weight="700" fill="#e6edf6">that decide a project</text><text x="50.0" y="294.4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="59" font-weight="700" fill="#38bdf8">1.2 GW</text><text x="468.0" y="269.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="24" font-weight="400" fill="#e6edf6">planned capacity</text><text x="468.0" y="305.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="18" font-weight="400" fill="#8a97a8">at the best site</text><line x1="50.0" y1="317.0" x2="1150.0" y2="317.0" stroke="#06090f" stroke-width="1"/><text x="50.0" y="381.4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="59" font-weight="700" fill="#e6edf6">38%</text><text x="468.0" y="356.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="24" font-weight="400" fill="#e6edf6">capacity factor</text><text x="468.0" y="392.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="18" font-weight="400" fill="#8a97a8">measured over 4 years</text><line x1="50.0" y1="404.0" x2="1150.0" y2="404.0" stroke="#06090f" stroke-width="1"/><text x="50.0" y="468.4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="59" font-weight="700" fill="#38bdf8">£1.4bn</text><text x="468.0" y="443.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="24" font-weight="400" fill="#e6edf6">cable cost</text><text x="468.0" y="479.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="18" font-weight="400" fill="#8a97a8">two-thirds of capex</text><line x1="50.0" y1="491.0" x2="1150.0" y2="491.0" stroke="#06090f" stroke-width="1"/><text x="50.0" y="555.4" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="59" font-weight="700" fill="#e6edf6">11 yrs</text><text x="468.0" y="530.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="24" font-weight="400" fill="#e6edf6">consent timeline</text><text x="468.0" y="566.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="18" font-weight="400" fill="#8a97a8">median for tidal</text><rect x="50.0" y="604.0" width="4.0" height="25.0" fill="#38bdf8"/><text x="68.0" y="621.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="25" font-weight="400" fill="#e6edf6">The resource is reliable; the grid connection is what sinks projects.</text><text x="68.0" y="651.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="18" font-weight="400" fill="#8a97a8">IEA Marine</text><rect x="50.0" y="678.0" width="4.0" height="25.0" fill="#38bdf8"/><text x="68.0" y="695.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="25" font-weight="400" fill="#e6edf6">Consenting takes longer than construction on every project reviewed.</text><text x="68.0" y="725.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="18" font-weight="400" fill="#8a97a8">Offshore Review</text><rect x="50.0" y="765.0" width="1100.0" height="110.0" rx="4.0" fill="#0e2736"/><rect x="50.0" y="765.0" width="5.0" height="110.0" fill="#38bdf8"/><text x="72.0" y="795.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#38bdf8" letter-spacing="2.6">TAKEAWAY</text><text x="72.0" y="833.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="24" font-weight="400" fill="#e6edf6">Output is set by the site, the cost by the cable, and the schedule by</text><text x="72.0" y="866.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="24" font-weight="400" fill="#e6edf6">the consent — in that order.</text></svg>