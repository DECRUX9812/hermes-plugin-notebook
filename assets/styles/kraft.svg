<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="gfx-title gfx-desc" data-template="quote_card" data-preset="kraft" data-detail="standard"><title id="gfx-title">Tidal power — what actually decides a project</title><desc id="gfx-desc">Kraft quote card. titled “Tidal power — what actually decides a project”. showing 6 figures (1.2 GW planned capacity; 38% capacity factor; £1.4bn cable cost). takeaway: Output is set by the site, the cost by the cable, and the schedule by the consent — in that order..</desc><defs><pattern id="tape" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#ffffff" opacity="0.42"/><rect width="3" height="9" fill="#000000" opacity="0.05"/></pattern></defs><rect x="0.0" y="0.0" width="1200.0" height="900.0" fill="#faf3df"/><g transform="rotate(12 190 108)"><rect x="115.0" y="86.0" width="150.0" height="44.0" fill="url(#tape)"/></g><g transform="rotate(-9 1000 772)"><rect x="925.0" y="750.0" width="150.0" height="44.0" fill="url(#tape)"/></g><text x="50.0" y="140.0" font-family="'Iowan Old Style','Charter','DejaVu Serif',Georgia,serif" font-size="270" font-weight="700" fill="#c9af8a">“</text><text x="50.0" y="435.0" font-family="'Iowan Old Style','Charter','DejaVu Serif',Georgia,serif" font-size="44" font-weight="400" fill="#211b12">The resource is reliable; the grid connection is</text><text x="50.0" y="494.0" font-family="'Iowan Old Style','Charter','DejaVu Serif',Georgia,serif" font-size="44" font-weight="400" fill="#211b12">what sinks projects.</text><rect x="50.0" y="563.0" width="46.0" height="3.0" fill="#8f5d24"/><text x="50.0" y="597.0" font-family="'Iowan Old Style','Charter','DejaVu Serif',Georgia,serif" font-size="22" font-weight="400" fill="#504737">IEA Marine</text></svg>