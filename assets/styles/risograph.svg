<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="gfx-title gfx-desc" data-template="comparison" data-preset="risograph" data-detail="standard"><title id="gfx-title">Tidal power — what actually decides a project</title><desc id="gfx-desc">Risograph comparison. titled “Tidal power — what actually decides a project”. showing 6 figures (1.2 GW planned capacity; 38% capacity factor; £1.4bn cable cost). takeaway: Output is set by the site, the cost by the cable, and the schedule by the consent — in that order..</desc><defs></defs><rect x="0.0" y="0.0" width="1200.0" height="900.0" fill="#f6f1e7"/><rect x="900.0" y="30.0" width="296.0" height="146.0" fill="#ff4f2e" opacity="0.15"/><rect x="16.0" y="570.0" width="224.0" height="180.0" fill="#1b3a8f" opacity="0.10"/><text x="50.0" y="66.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#1b3a8f" letter-spacing="3">FIELD NOTES</text><rect x="50.0" y="78.0" width="72.0" height="3.0" fill="#1b3a8f"/><text x="1150.0" y="65.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#4a5166" text-anchor="end">Risograph · A vs B</text><text x="50.0" y="132.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="50" font-weight="700" fill="#16223b">Tidal power — what</text><text x="50.0" y="186.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="50" font-weight="700" fill="#16223b">actually decides a project</text><rect x="50.0" y="232.0" width="541.0" height="618.0" fill="#fbf7ef"/><rect x="50.0" y="232.0" width="541.0" height="5.0" rx="2.0" fill="#1b3a8f"/><text x="70.0" y="278.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700" fill="#16223b">Tidal</text><circle cx="74.0" cy="312.0" r="3.5" fill="#1b3a8f"/><text x="88.0" y="318.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#16223b">Predictable output</text><circle cx="74.0" cy="334.0" r="3.5" fill="#1b3a8f"/><text x="88.0" y="340.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#16223b">High capex</text><text x="70.0" y="824.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#1b3a8f">38% CF</text><rect x="609.0" y="232.0" width="541.0" height="618.0" fill="#fbf7ef"/><rect x="609.0" y="232.0" width="541.0" height="5.0" rx="2.0" fill="#ff4f2e"/><text x="629.0" y="278.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700" fill="#16223b">Offshore wind</text><circle cx="633.0" cy="312.0" r="3.5" fill="#ff4f2e"/><text x="647.0" y="318.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#16223b">Variable output</text><circle cx="633.0" cy="334.0" r="3.5" fill="#ff4f2e"/><text x="647.0" y="340.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#16223b">Cheaper per MW</text><text x="629.0" y="824.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#cb3c20">45% CF</text></svg>