<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="gfx-title gfx-desc" data-template="comparison" data-preset="matcha" data-detail="standard"><title id="gfx-title">Tidal power — what actually decides a project</title><desc id="gfx-desc">Matcha comparison. titled “Tidal power — what actually decides a project”. showing 6 figures (1.2 GW planned capacity; 38% capacity factor; £1.4bn cable cost). takeaway: Output is set by the site, the cost by the cable, and the schedule by the consent — in that order..</desc><defs></defs><rect x="0.0" y="0.0" width="1200.0" height="900.0" fill="#f3f5e9"/><text x="50.0" y="66.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#3d7d00" letter-spacing="3">MATCHA</text><rect x="50.0" y="78.0" width="72.0" height="3.0" fill="#4d9900"/><text x="1150.0" y="65.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#5a6b2a" text-anchor="end">Matcha · A vs B</text><text x="50.0" y="132.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="50" font-weight="700" fill="#1e2616">Tidal power — what</text><text x="50.0" y="186.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="50" font-weight="700" fill="#1e2616">actually decides a project</text><line x1="50.0" y1="222.0" x2="1150.0" y2="222.0" stroke="#1e2616" stroke-width="2"/><line x1="50.0" y1="226.0" x2="1150.0" y2="226.0" stroke="#d5d7cd" stroke-width="1"/><rect x="50.0" y="254.0" width="541.0" height="596.0" rx="6.0" fill="#fbfdf3"/><rect x="50.0" y="254.0" width="541.0" height="5.0" rx="2.0" fill="#4d9900"/><text x="70.0" y="300.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700" fill="#1e2616">Tidal</text><circle cx="74.0" cy="334.0" r="3.5" fill="#4d9900"/><text x="88.0" y="340.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#1e2616">Predictable output</text><circle cx="74.0" cy="356.0" r="3.5" fill="#4d9900"/><text x="88.0" y="362.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#1e2616">High capex</text><text x="70.0" y="824.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#3f8100">38% CF</text><rect x="609.0" y="254.0" width="541.0" height="596.0" rx="6.0" fill="#fbfdf3"/><rect x="609.0" y="254.0" width="541.0" height="5.0" rx="2.0" fill="#c47620"/><text x="629.0" y="300.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700" fill="#1e2616">Offshore wind</text><circle cx="633.0" cy="334.0" r="3.5" fill="#c47620"/><text x="647.0" y="340.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#1e2616">Variable output</text><circle cx="633.0" cy="356.0" r="3.5" fill="#c47620"/><text x="647.0" y="362.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#1e2616">Cheaper per MW</text><text x="629.0" y="824.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#a6621b">45% CF</text></svg>