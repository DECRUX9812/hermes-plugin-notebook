 font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#6b6b6b">Offshore Review</text><line x1="50.0" y1="765.0" x2="1150.0" y2="765.0" stroke="#0b0b0b" stroke-width="2"/><rect x="50.0" y="767.0" width="1100.0" height="108.0" fill="#f6f6f6"/><rect x="50.0" y="765.0" width="5.0" height="110.0" fill="#c1121f"/><text x="72.0" y="795.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#9e0e19" letter-spacing="2.6">TAKEAWAY</text><text x="72.0" y="833.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#0b0b0b">Output is set by the site, the cost by the cable, and the schedule by the consent — in</text><text x="72.0" y="866.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#0b0b0b">that order.</text></svg>