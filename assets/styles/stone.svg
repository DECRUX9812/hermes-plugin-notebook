<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="gfx-title gfx-desc" data-template="infographic" data-preset="stone" data-detail="standard"><title id="gfx-title">Tidal power — what actually decides a project</title><desc id="gfx-desc">Stone infographic. titled “Tidal power — what actually decides a project”. showing 6 figures (1.2 GW planned capacity; 38% capacity factor; £1.4bn cable cost). takeaway: Output is set by the site, the cost by the cable, and the schedule by the consent — in that order..</desc><defs></defs><rect x="0.0" y="0.0" width="1200.0" height="900.0" fill="#f4f3f1"/><line x1="26.0" y1="26.0" x2="52.0" y2="26.0" stroke="#6e6e76" stroke-width="1" opacity="0.65"/><line x1="26.0" y1="26.0" x2="26.0" y2="52.0" stroke="#6e6e76" stroke-width="1" opacity="0.65"/><line x1="26.0" y1="26.0" x2="35.0" y2="26.0" stroke="#8f7154" stroke-width="3"/><line x1="1174.0" y1="26.0" x2="1148.0" y2="26.0" stroke="#6e6e76" stroke-width="1" opacity="0.65"/><line x1="1174.0" y1="26.0" x2="1174.0" y2="52.0" stroke="#6e6e76" stroke-width="1" opacity="0.65"/><line x1="1174.0" y1="26.0" x2="1165.0" y2="26.0" stroke="#8f7154" stroke-width="3"/><line x1="26.0" y1="874.0" x2="52.0" y2="874.0" stroke="#6e6e76" stroke-width="1" opacity="0.65"/><line x1="26.0" y1="874.0" x2="26.0" y2="848.0" stroke="#6e6e76" stroke-width="1" opacity="0.65"/><line x1="26.0" y1="874.0" x2="35.0" y2="874.0" stroke="#8f7154" stroke-width="3"/><line x1="1174.0" y1="874.0" x2="1148.0" y2="874.0" stroke="#6e6e76" stroke-width="1" opacity="0.65"/><line x1="1174.0" y1="874.0" x2="1174.0" y2="848.0" stroke="#6e6e76" stroke-width="1" opacity="0.65"/><line x1="1174.0" y1="874.0" x2="1165.0" y2="874.0" stroke="#8f7154" stroke-width="3"/><text x="50.0" y="66.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#85694e" letter-spacing="3">S