s Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="55" font-weight="700" fill="#64707f">£1.4bn</text><text x="468.0" y="450.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="24" font-weight="400" fill="#25252a">cable cost</text><text x="468.0" y="486.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="18" font-weight="400" fill="#6e6e76">two-thirds of capex</text><line x1="50.0" y1="495.0" x2="1150.0" y2="495.0" stroke="#d1d0cf" stroke-width="1"/><text x="50.0" y="555.1" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="55" font-weight="700" fill="#25252a">11 yrs</text><text x="468.0" y="531.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="24" font-weight="400" fill="#25252a">consent timeline</text><text x="468.0" y="567.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="18" font-weight="400" fill="#6e6e76">median for tidal</text><rect x="50.0" y="604.0" width="4.0" height="25.0" fill="#8f7154"/><text x="68.0" y="621.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="25" font-weight="400" fill="#25252a">The resource is reliable; the grid connection is what sinks projects.</text><text x="68.0" y="651.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="18" font-weight="400" fill="#6e6e76">IEA Marine</text><rect x="50.0" y="678.0" width="4.0" height="25.0" fill="#8f7154"/><text x="68.0" y="695.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="25" font-weight="400" fill="#25252a">Consenting takes longer than construction on every project reviewed.</text><text x="68.0" y="725.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="18" font-weight="400" fill="#6e6e76">Offshore Review</text><line x1="50.0" y1="765.0" x2="1150.0" y2="765.0" stroke="#25252a" stroke-width="2"/><rect x="50.0" y="767.0" width="1100.0" height="108.0" fill="#ffffff"/><rect x="50.0" y="765.0" width="5.0" height="110.0" fill="#8f7154"/><text x="72.0" y="795.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#755c44" letter-spacing="2.6">TAKEAWAY</text><text x="72.0" y="833.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="24" font-weight="400" fill="#25252a">Output is set by the site, the cost by the cable, and the schedule by</text><text x="72.0" y="866.0" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace" font-size="24" font-weight="400" fill="#25252a">the consent — in that order.</text></svg>