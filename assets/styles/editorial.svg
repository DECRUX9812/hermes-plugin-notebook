<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="gfx-title gfx-desc" data-template="infographic" data-preset="editorial" data-detail="standard"><title id="gfx-title">Tidal power — the three facts that decide a project</title><desc id="gfx-desc">Editorial infographic. titled “Tidal power — the three facts that decide a project”. showing 6 figures (1.2 GW planned capacity; 38% capacity factor; £1.4bn cable cost). takeaway: Output is set by the site, the cost by the cable, and the schedule by the consent — in that order..</desc><defs></defs><rect x="0.0" y="0.0" width="1200.0" height="900.0" fill="#ffffff"/><text x="50.0" y="66.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#1a73e8" letter-spacing="3">INFOGRAPHIC</text><rect x="50.0" y="78.0" width="72.0" height="3.0" fill="#1a73e8"/><text x="1150.0" y="65.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#6b6b6b" text-anchor="end">Editorial · 4 stats</text><text x="50.0" y="132.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="50" font-weight="700" fill="#1f1f1f">Tidal power — the three facts that</text><text x="50.0" y="186.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="50" font-weight="700" fill="#1f1f1f">decide a project</text><line x1="50.0" y1="222.0" x2="1150.0" y2="222.0" stroke="#1f1f1f" stroke-width="2"/><line x1="50.0" y1="226.0" x2="1150.0" y2="226.0" stroke="#e0e0e0" stroke-width="1"/><text x="50.0" y="312.1" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="55" font-weight="700" fill="#1a73e8">1.2 GW</text><text x="468.0" y="288.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#1f1f1f">planned capacity</text><text x="468.0" y="324.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#6b6b6b">at the best site</text><line x1="50.0" y1="333.0" x2="1150.0" y2="333.0" stroke="#dbdbdb" stroke-width="1"/><text x="50.0" y="393.1" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="55" font-weight="700" fill="#1a73e8">38%</text><text x="468.0" y="369.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#1f1f1f">capacity factor</text><text x="468.0" y="405.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#6b6b6b">measured over 4 years</text><line x1="50.0" y1="414.0" x2="1150.0" y2="414.0" stroke="#dbdbdb" stroke-width="1"/><text x="50.0" y="474.1" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="55" font-weight="700" fill="#1a73e8">£1.4bn</text><text x="468.0" y="450.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#1f1f1f">cable cost</text><text x="468.0" y="486.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#6b6b6b">two-thirds of capex</text><line x1="50.0" y1="495.0" x2="1150.0" y2="495.0" stroke="#dbdbdb" stroke-width="1"/><text x="50.0" y="555.1" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="55" font-weight="700" fill="#1a73e8">11 yrs</text><text x="468.0" y="531.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#1f1f1f">consent timeline</text><text x="468.0" y="567.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#6b6b6b">median for tidal</text><rect x="50.0" y="604.0" width="4.0" height="25.0" fill="#1a73e8"/><text x="68.0" y="621.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="400" fill="#1f1f1f">The resource is reliable; the grid connection is what sinks projects.</text><text x="68.0" y="651.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#6b6b6b">IEA Marine</text><rect x="50.0" y="678.0" width="4.0" height="25.0" fill="#1a73e8"/><text x="68.0" y="695.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="400" fill="#1f1f1f">Consenting takes longer than construction on every project reviewed.</text><text x="68.0" y="725.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#6b6b6b">Offshore Review</text><line x1="50.0" y1="765.0" x2="1150.0" y2="765.0" stroke="#1f1f1f" stroke-width="2"/><rect x="50.0" y="767.0" width="1100.0" height="108.0" fill="#ffffff"/><rect x="50.0" y="765.0" width="5.0" height="110.0" fill="#1a73e8"/><text x="72.0" y="795.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#155ebe" letter-spacing="2.6">TAKEAWAY</text><text x="72.0" y="833.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#1f1f1f">Output is set by the site, the cost by the cable, and the schedule by the consent — in</text><text x="72.0" y="866.0" font-family="'Inter var','Inter','DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400" fill="#1f1f1f">that order.</text></svg>