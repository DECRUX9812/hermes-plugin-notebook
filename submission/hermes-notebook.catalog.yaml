# hermes-agent PR at competition submission time.
#
# BEFORE SUBMITTING: replace the sha below with the full 40-char SHA of the
# plugin repo commit you want catalog installs to check out, and rewrite every
# raw.githubusercontent URL to use the same SHA:
#   cd hermes-plugin-notebook && git rev-parse HEAD
# The pinned commit must contain the final code AND the screenshots — anything
# committed after the pin is NOT what users install or see.

name: hermes-notebook
repo: https://github.com/DECRUX9812/hermes-plugin-notebook
sha: "187849b78c098e31fa06423a2e4b3963f52ff57e"
version: "2.0.0"
title: Hermes Notebook
category: desktop
description: >-
  A research studio inside Hermes Desktop: sources in, cited answers and
  studio artifacts out. Add files, PDFs, Office docs, EPUB, images, audio and
  video recordings (Whisper), web pages, YouTube and pasted text, or find
  sources on the web without leaving the page; every source is auto-labelled
  and deduplicated on ingest. Ask in as many named threads as you like —
  answers come only from the sources, with stable [S1] citations that carry
  the passage they were built from, and every answer shows its cost receipt.
  Tensions audits where the sources disagree — quoted conflicts with a
  measured independence count (8 sources, 7 independent) plus a stable-ground
  consensus. Studio outputs: audio overviews in four formats (two-host, real
  waveform + transcript), narrated video overviews, mind maps, flashcards,
  quizzes, real .pptx slide decks, .xlsx/.csv data tables, briefing docs,
  timelines — and infographics that verify every printed figure against its
  cited source and show a Checked panel of what was verified, re-cited and
  dropped. Study mode schedules reviews with SM-2 spaced repetition. Agent
  half: 19 tools (list/create/add_source/ask/generate/audio/video/suggest/
  search/note/refresh/delete_source/update/export/discover/study/tensions/
  threads/delete), a /notebook slash command, a hermes notebook CLI, a bundled
  skill and an auxiliary.notebook slot for cheap labelling + history
  compaction. Backend routes under /api/plugins/hermes-notebook/ including
  /progress + /cancel for long jobs. Disclosure — add_source/ask/generate/
  audio/video/suggest/tensions make host-owned LLM calls through ctx.llm on
  the user's active model (verified on small local and mid-size hosted
  models); web pages go through web_extract with a direct-fetch fallback that
  refuses private-network addresses; discover uses the host web_search or an
  EXA/TAVILY key; YouTube sources fetch public transcripts; audio/video
  synthesis calls edge-tts (ffmpeg on PATH, Pillow for cards); agent actions
  route through the host MCP gate; read-only in-memory SQL for data tables;
  long jobs are cooperatively cancellable; no shell commands issued.
