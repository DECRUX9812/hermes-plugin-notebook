name: hermes-notebook
repo: https://github.com/DECRUX9812/hermes-plugin-notebook
sha: "d18d2a38cef8d1cbf7e530c48ddedbc8154bf8bb"
version: "0.1.0"
title: Hermes Notebook
description: >-
  NotebookLM-style notebooks for Hermes: gather sources (local files, PDFs,
  Office docs, web pages, YouTube videos, pasted text, images described by
  vision), then ask questions answered ONLY from those sources with [S1]
  citations mapped back to source titles. Every ingested source is auto-labeled
  with topic tags and a one-line summary, and notebook_suggest recommends
  questions worth asking, artifacts worth generating, and gaps to fill.
  notebook_generate writes study artifacts — summary, briefing doc, study
  guide, FAQ, timeline, mind map (markdown + Mermaid + JSON), flashcards and
  quiz — into the notebook's artifacts directory. notebook_audio produces a
  two-host conversational podcast overview (edge-tts neural voices, ffmpeg
  assembly) and notebook_video a cinematic single-narrator mp4 with
  Pillow-rendered title cards, both with transcripts. Ships a /notebook slash
  command, a `hermes notebook` CLI, a bundled skill teaching grounded-research
  workflow, and an auxiliary task slot for cheap labeling calls. All state
  lives under $HERMES_HOME/plugin-data/hermes-notebook/ per profile. Disclosure
  — notebook_add_source/ask/generate/audio/suggest make host-owned LLM calls
  through ctx.llm on the user's active model (labeling first tries the
  plugin's auxiliary.notebook slot, then falls back); web pages go through the
  built-in web_extract tool with a direct-fetch fallback that refuses
  private-network addresses; YouTube sources fetch public transcripts; audio
  synthesis calls the edge-tts service; ffmpeg must be on PATH for audio/video.
