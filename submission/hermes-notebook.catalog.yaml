sha: "acdec580282c65b048982675296a906f6a746cc2"
version: "1.4.0"
title: Hermes Notebook
category: desktop
description: >-
  NotebookLM, rebuilt as a real product surface inside Hermes Desktop — and
  grounded the way only a plugin can be. The desktop studio is three columns:
  a source rail with the model's own auto-labels and search, a chat that
  answers only from those sources with numbered [S1] citations that open the
  source they point at, and a Studio panel with twelve outputs — Video
  Overview, Audio Overview (two-host podcast with a real waveform and
  transcript), Summary, Briefing Doc, Study Guide, FAQ, Timeline, Mind Map
  (pannable SVG tree), Flashcards (flip deck, Anki export), Quiz, Slides and
  Infographic. Generation runs through hermes_notebook.artifacts, so the page
  and the tools can never disagree. The same window carries a second surface,
  Lab Ops: eight hosts measured over an audited ssh transport with kernel
  patch posture, then a terminal, service control, a file browser and VM
  snapshots that report the real exit code. Agent half: 16 tools
  (list/create/add_source/ask/generate/audio/video/suggest/search/note/
  refresh/delete_source/update/export/discover/delete), a /notebook slash
  command, a `hermes notebook` CLI, a bundled skill, and an auxiliary task
  slot for cheap labelling. Backend routes at /api/plugins/hermes-notebook/
  (state, source, ask, generate, label, artifact, plus /ops/*) so the page
  reads the same store the agent writes. Disclosure — add_source/ask/
  generate/audio/video/suggest make host-owned LLM calls through ctx.llm on
  the user's active model; web pages go through web_extract with a
  direct-fetch fallback that refuses private-network addresses; discover uses
  web_search; YouTube sources fetch public transcripts; audio/video synthesis
  calls edge-tts (ffmpeg on PATH, Pillow for video cards and infographics);
  the Lab Ops deck runs ssh/docker/systemctl/qm only for hosts in
  dashboard/hosts.json, validates every target, requires a typed confirm for
  destructive actions, and appends each call to an audit log.
