name: hermes-notebook
version: 1.6.0
manifest_version: 2
api_version: 1
description: >-
  NotebookLM inside Hermes Desktop, plus the lab deck. Desktop half: a
  three-column studio (sources rail with model labels and search; grounded
  chat whose [S1] citations open the source; a Studio panel with twelve
  outputs — video and audio overviews, summary, briefing doc, study guide,
  FAQ, timeline, mind map, flashcards, quiz, slides, infographic — an SVG
  graphics library: 38 looks x 9 layouts x 3 shapes x 3 detail levels) and a
  Lab Ops surface that measures a fleet over audited ssh and drives a
  terminal, services, files and VM snapshots. Parity pack: recordings
  (mp3/m4a/wav/mp4/mov/webm…) become sources by transcription, any studio
  card can be briefed from the open conversation, every artifact can be
  written in another language, slide decks export to real .pptx, and Discover
  runs multi-round deep research. Agent half: gather sources (files, PDFs,
  Office docs, epub, web pages, YouTube, pasted text, images, audio/video
  recordings, notes), ask questions answered only from those sources (in any
  number of separate conversations per notebook), search, auto-label,
  generate artifacts, produce audio/video overviews, discover and refresh
  sources, and export notebooks.
author: Ritesh Patel
license: MIT
homepage: https://github.com/DECRUX9812/hermes-plugin-notebook
tags: [notebook, research, citations, study, podcast, audio-overview, knowledge]
requires_hermes: ">=0.22"
provides_tools:
  - notebook_list
  - notebook_create
  - notebook_add_source
  - notebook_ask
  - notebook_generate
  - notebook_audio
  - notebook_video
  - notebook_suggest
  - notebook_threads
  - notebook_search
  - notebook_note
  - notebook_refresh
  - notebook_delete_source
  - notebook_update
  - notebook_export
  - notebook_discover
  - notebook_delete
  - notebook_study
  - notebook_tensions
provides_hooks: []
config_schema:
  default_notebook:
    type: str
    default: ""
    label: Default notebook
    description: Notebook used when a tool call does not name one.
  ask_context_chars:
    type: int
    default: 28000
    label: Chat context budget
    description: Max characters of source text sent to the model per notebook_ask call.
  podcast_context_chars:
    type: int
    default: 42000
    label: Podcast context budget
    description: Max characters of source text used to write an audio overview script.
  audio_voice_host_a:
    type: str
    default: "en-US-AndrewNeural"
    label: Host A voice (edge-tts)
    description: Neural voice for the first podcast host. edge-tts voice names, e.g. en-US-AndrewNeural.
  audio_voice_host_b:
    type: str
    default: "en-US-EmmaNeural"
    label: Host B voice (edge-tts)
    description: Neural voice for the second podcast host.
  podcast_length:
    type: str
    default: medium
    choices: [short, medium, long]
    label: Default podcast length
    description: Target runtime for audio overviews when the tool call does not say.
  video_voice:
    type: str
    default: "en-US-AndrewNeural"
    label: Video narrator voice (edge-tts)
    description: Neural voice for the single narrator of video overviews.
  video_voice_rate:
    type: str
    default: "-4%"
    label: Video narrator rate
    description: edge-tts rate modifier for the video narrator (e.g. -4% = slightly slower, cinematic).
  video_length:
    type: str
    default: medium
    choices: [short, medium, long]
    label: Default video length
    description: Target runtime for video overviews when the tool call does not say.
  video_style:
    type: str
    default: cinematic
    choices: [cinematic, explainer]
    label: Default video style
    description: Documentary (cinematic) or quick tech-explainer narration for video overviews when the tool call does not say.
  audio_tts_concurrency:
    type: int
    default: 4
    label: TTS segment concurrency
    description: Parallel edge-tts segment synthesis workers (1-8). Lower if you hit throttling.
python_dependencies:
  - "pillow>=10,<14"
  - "pypdf>=4.2,<7"
  - "edge-tts>=7.0,<8"
  - "youtube-transcript-api>=1.0,<2"
  - "trafilatura>=1.6,<3"
  - "openpyxl>=3.1,<4"
