<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Hermes Web Harness</title>
  <link rel="stylesheet" href="/ui/theme.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%234c6ef5'/><path d='M4 11V5l4 4 4-4v6' stroke='white' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="navToggle" aria-label="Show navigation" aria-expanded="false">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h14M3 10h14M3 14h14"/></svg>
    </button>
    <a class="brand" href="#/home">
      <span class="brand-mark" aria-hidden="true">H</span>
      <span class="brand-name">Hermes Web Harness</span>
    </a>
    <span class="chip" id="runtimeChip" hidden></span>
    <div class="topbar-right">
      <button class="btn btn-ghost cmdk-trigger" id="cmdkTrigger" aria-label="Open command palette" title="Command palette (⌘K / Ctrl+K)">
        <span>Command…</span>
        <kbd>⌘K</kbd>
      </button>
      <span class="health" id="health" title="Loading health…"><span class="dot"></span><span class="health-text">…</span></span>
      <button class="icon-btn" id="themeToggle" aria-label="Switch theme" title="Switch theme">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="4"/><path d="M10 1v2M10 17v2M1 10h2M17 10h2M3.5 3.5l1.4 1.4M15.1 15.1l1.4 1.4M16.5 3.5l-1.4 1.4M4.9 15.1l-1.4 1.4"/></svg>
      </button>
    </div>
  </header>

  <div class="shell">
    <nav class="rail" id="rail" aria-label="Destinations">
      <a class="nav-item" data-nav="home" href="#/home"><span class="nav-glyph">◍</span>Home<i class="nav-badge" id="badgeHome" hidden></i></a>
      <a class="nav-item" data-nav="threads" href="#/threads"><span class="nav-glyph">❯</span>Threads<i class="nav-badge" id="badgeThreads" hidden></i></a>
      <a class="nav-item" data-nav="tasks" href="#/tasks"><span class="nav-glyph">▦</span>Tasks</a>
      <a class="nav-item" data-nav="settings" href="#/settings"><span class="nav-glyph">⚙</span>Settings</a>
      <div class="rail-section" id="railProjects"></div>
      <div class="rail-foot"><a href="/logout" class="muted-link">Sign out</a></div>
    </nav>

    <main id="main" class="main" tabindex="-1">
      <div class="loading">Loading…</div>
    </main>

    <aside class="inspector" id="inspector" aria-label="Context" hidden></aside>
  </div>

  <div class="cmdk-backdrop" id="cmdkModal" role="dialog" aria-modal="true" aria-label="Command palette" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/ui/app.js"></script>
</body>
</html>
