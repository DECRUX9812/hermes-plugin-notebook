<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>hermes notebook — extended tools</title>
<style>
:root{--bg:#0b0c10;--canvas:#1a1b26;--surface:#16161e;--ink:#a9b1d6;--txt:#c0caf5;--dim:#565f89;
--blue:#7aa2f7;--cyan:#7dcfff;--green:#9ece6a;--yellow:#e0af68;--magenta:#bb9af7;--red:#f7768e;--mono:"JetBrains Mono",Menlo,monospace;--sans:"Inter",system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:var(--mono);color:var(--txt)}
.scene{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}.scene.on{display:flex}
.badge{position:absolute;top:26px;right:34px;font-family:var(--sans);font-size:20px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
.term{width:1560px;height:860px;background:var(--canvas);border-radius:14px;border:1px solid rgba(255,255,255,.09);box-shadow:0 40px 100px -30px rgba(0,0,0,.85);display:flex;flex-direction:column;overflow:hidden}
.term-bar{height:46px;background:var(--surface);display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.06)}
.dot{width:13px;height:13px;border-radius:50%}.dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}.term-title{margin-left:14px;font-size:19px;color:var(--dim)}
.term-body{flex:1;padding:26px 30px;font-size:20px;line-height:1.6;overflow:hidden;white-space:pre-wrap;word-break:break-word}
.p{color:var(--green)}.u{color:var(--blue)}.cm{color:var(--dim)}.j-k{color:var(--cyan)}.j-s{color:var(--green)}.j-n{color:var(--yellow)}.j-b{color:var(--magenta)}.hl{color:#fff;font-weight:700}
.cursor-blink{display:inline-block;width:.55em;height:1.1em;background:var(--cyan);vertical-align:-.15em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style></head><body>
<div class="scene" id="s-a"><div class="badge">notes · search · discover · export</div>
<div class="term"><div class="term-bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="term-title">hermes — zsh</span></div><div class="term-body" id="t-a"></div></div></div>
<div class="scene" id="s-b"><div class="badge">more artifacts</div>
<div class="term"><div class="term-bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="term-title">hermes — zsh</span></div><div class="term-body" id="t-b"></div></div></div>
<script>
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms)),esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function hlJson(l){return esc(l).replace(/("(?:[^"\\]|\\.)*")\s*:/g,'<span class="j-k">$1</span>:').replace(/: "((?:[^"\\]|\\.)*)"/g,': <span class="j-s">"$1"</span>').replace(/: (\d+)/g,': <span class="j-n">$1</span>').replace(/: (true|false|null)/g,': <span class="j-b">$1</span>');}
async function typeCmd(el,cmd){const line=document.createElement('div');line.innerHTML=`<span class="p">➜</span> <span class="u">~/demo</span> <span class="p">$</span> <span class="cmd"></span><span class="cursor-blink"></span>`;el.appendChild(line);await sleep(400);const c=line.querySelector('.cmd');for(const ch of cmd){c.textContent+=ch;await sleep(30+Math.random()*26);}await sleep(380);line.querySelector('.cursor-blink').remove();}
async function out(el,lines,per=80){for(const l of lines){const d=document.createElement('div');d.innerHTML=/^[{\[]|^\s*"/.test(l)?hlJson(l):esc(l);el.appendChild(d);await sleep(per+Math.random()*50);}}
async function sceneA(){const el=$('t-a');
 await typeCmd(el,'hermes notebook note french-revolution-cell-bio "Exam covers causes + Estates-General"');
 await out(el,['{ "ok": true, "source_id": "exam-covers-causes-estates-general", "kind": "note", "chars": 52 }']);
 await sleep(400);
 await typeCmd(el,'hermes notebook search french-revolution-cell-bio "bastille"');
 await out(el,['{ "ok": true, "query": "bastille", "hits": [','  { "source_id": "french-revolution", "score": 0.81,','    "snippet": "The storming of the Bastille on July 14 became a defining symbol…" },','  { "source_id": "exam-covers-causes-estates-general", "score": 0.44,','    "snippet": "Exam covers causes + Estates-General" }',' ] }']);
 await sleep(500);
 await typeCmd(el,'hermes notebook discover french-revolution-cell-bio --query "french revolution causes" --max 3');
 await out(el,['{ "ok": true, "candidates": [','  { "title": "Causes of the French Revolution — Wikipedia",','    "url": "https://en.wikipedia.org/wiki/Causes_of_the_French_Revolution" },','  { "title": "French Revolution — Britannica",','    "url": "https://www.britannica.com/event/French-Revolution" }',' ], "hint": "nothing was added automatically" }']);
 await sleep(400);
 await typeCmd(el,'hermes notebook export french-revolution-cell-bio');
 await out(el,['{ "ok": true, "zip": "…/exports/french-revolution-cell-bio-20261106.zip", "files": 24, "size_bytes": 1842031 }']);}
async function sceneB(){const el=$('t-b');
 await typeCmd(el,'hermes notebook generate french-revolution-cell-bio slides');
 await out(el,['{ "ok": true, "kind": "slides", "path": "…/artifacts/…-slides.html" }']);
 await sleep(400);
 await typeCmd(el,'hermes notebook generate french-revolution-cell-bio infographic');
 await out(el,['{ "ok": true, "kind": "infographic", "path": "…/artifacts/…-infographic.png" }']);
 await sleep(400);
 await typeCmd(el,'hermes notebook generate french-revolution-cell-bio flashcards --format csv');
 await out(el,['{ "ok": true, "kind": "flashcards", "format": "csv", "path": "…/artifacts/…-flashcards.csv" }']);
 await sleep(400);
 await typeCmd(el,'hermes notebook video french-revolution-cell-bio --style explainer');
 await out(el,['{ "ok": true, "kind": "video_overview", "style": "explainer",','  "video": "…/artifacts/…-video_overview.mp4", "media": "MEDIA:…/video.mp4" }']);}
const SCENES=[['s-a',0,52000,sceneA],['s-b',52000,36000,sceneB]];
function show(id){document.querySelectorAll('.scene').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');}
async function run(){for(const [id,,dur,fn] of SCENES){show(id);const t0=Date.now();await fn().catch(()=>{});const left=dur-(Date.now()-t0);if(left>0)await sleep(left);}}
run();
</script></body></html>
